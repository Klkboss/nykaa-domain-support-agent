# v2: Alembic migrations for the PostgreSQL schema (app/db/models.py).
# The database URL is NOT stored here: migrations/env.py reads DATABASE_URL from the environment.
#   $env:DATABASE_URL = "postgresql://nykaa:nykaa@localhost:5432/nykaa"   (PowerShell)
#   .venv\Scripts\python.exe -m alembic upgrade head
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
