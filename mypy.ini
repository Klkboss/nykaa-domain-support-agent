# v2 type-check policy: BLOCKING on new v2 modules (strict), report-only on the capstone code.
# follow_imports=silent: imported capstone modules are analysed for types but their own errors are not reported.
[mypy]
python_version = 3.12
follow_imports = silent
ignore_missing_imports = True
explicit_package_bases = True
mypy_path = .
warn_unused_configs = True

[mypy-app.llm.*]
strict = True
